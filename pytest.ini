[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts =
    -v
    --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    database: marks tests that require a real database connection (deselect with -k "not test_database")
    
[flake8]
max-line-length = 88