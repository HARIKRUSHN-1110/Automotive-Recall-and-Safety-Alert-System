name: CI Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Lint 
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 src/ tests/ \
            --max-line-length=100 \
            --exclude=__pycache__,.venv,venv \
            --ignore=E501,W503,E203,E221,E241,E251,E302,E303,E305,E402,E265,E272,E231,W291,W292,W293,W504,F401,F541,F841

  # Tests 
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      DATABASE_URL: "sqlite:///data/automotive_recall.db"
      HF_REPO_ID: ${{ secrets.HF_REPO_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download NLTK data
        run: |
          python -c "
          import nltk
          nltk.download('punkt', quiet=True)
          nltk.download('punkt_tab', quiet=True)
          nltk.download('stopwords', quiet=True)
          "

      - name: Run pytest
        run: |
          pytest tests/ -v \
            --tb=short \
            --ignore=tests/test_setup.py \
            -k "not test_database"

  # Docker build check
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t autosafe:ci-test .
          echo "Docker image built successfully"

      - name: Verify image runs
        run: |
          docker run --rm autosafe:ci-test \
            python -c "import streamlit; import lightgbm; import sqlalchemy; print('All key packages importable')"